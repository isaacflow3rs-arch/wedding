<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaac & Valeria</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#fdf6f0,#fff);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            color:#444;
        }

        .card{
            background:white;
            width:min(90%,450px);
            padding:50px 35px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.12);
            text-align:center;
        }

        h1{
            font-size:2.5rem;
            margin-bottom:10px;
            color:#310505;
        }

        h2{
            font-weight:300;
            margin-bottom:35px;
            color:#777;
        }

        p{
            margin-bottom:30px;
            line-height:1.6;
        }

        .button{
            display:block;
            text-decoration:none;
            padding:18px;
            margin:18px 0;
            border-radius:14px;
            font-size:1.1rem;
            font-weight:600;
            transition:.2s;
        }

        .venmo{
            background:#24582a;
            color:white;
        }

        .amazon{
            background:#a2470b;
            color:white;
        }

        .button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(0,0,0,.18);
        }

        footer{
            margin-top:35px;
            color:#999;
            font-size:.85rem;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Isaac & Valeria</h1>
    <h2>Thank you for celebrating with us!</h2>

    <p>
        We are so grateful for your love and support.
        If you'd like to bless us with a gift,
        you can use either option below.
    </p>

    <a class="button venmo"
       href="https://www.venmo.com/u/isaacandvaleria"
       target="_blank">
       💙 Venmo
    </a>

    <a class="button amazon"
       href="https://www.amazon.com/wedding/guest-view/O1Q3KUDBHEZ9"
       target="_blank">
       🎁 Amazon Registry
    </a>

    <footer>
        With love,<br>
        Isaac & Valeria
    </footer>

</div>

</body>
</html>
